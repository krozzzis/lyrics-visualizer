<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lyrics Visualizer</title>
  <script>
    // Set data-theme before first paint so there's no flash of the wrong
    // theme; web-src/lib/theme.js re-derives (and takes over) the same value
    // once Solid mounts, from the same localStorage key.
    (function () {
      try {
        var t = localStorage.getItem('lyrics-visualizer:theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.jsx"></script>
</body>
</html>
