# Lyrics visualizer config. Copy this file to config.yaml (gitignored) and
# point it at your own subtitle/audio/font — e.g. drop them in data/, which
# is gitignored too, so your own project files never end up in git history.
# Every path here is resolved relative to this file's own directory.
#
# This example points at the bundled demo subtitle so `npm run build && node
# bin/serve.js -c config.example.yaml` works out of the box with no files of
# your own.
#
# Everything below except subtitle/audio/font.path can also be tuned live in
# the browser's Settings panel (top-right "Settings" button) — click "Save
# to config.yaml" there to write your changes back to this file. Note that
# doing so rewrites the file without comments (js-yaml can't preserve them).

# Subtitle file: .ass (incl. \k karaoke tags), .srt or .vtt.
subtitle: ./example/demo.ass

# Optional: audio to play in the browser preview and mux into the rendered
# video. Omitted here — point it at your own track, e.g. audio: ./data/song.mp3
# audio: ./data/song.mp3

font:
  # Family name the font is registered under (Node) / declared as (browser).
  # Doesn't need to match the font file's internal name.
  family: LyricsFont
  # .ttf/.otf file to bundle. Required — see README for why.
  path: ./example/fonts/DejaVuSans.ttf
  size: 72
  weight: normal
  style: normal

colors:
  text: "#000000"
  # 6-digit hex, 8-digit hex (RRGGBBAA) for translucency, "transparent",
  # or any CSS color (rgb()/rgba()/hsl()/named).
  background: "#FFFFFF"

output:
  width: 1920
  height: 1080
  fps: 30
  # Optional explicit total duration in seconds. If omitted: audio duration
  # (when audio is set), else last cue's end time + 2s.
  # duration: 210

camera:
  # Where a jump centers the active line: "center" of the whole line, or
  # "start" of its first word.
  anchor: center
  # Seconds each jump animation takes.
  jumpDuration: 0.22
  # "easeOutBack" (snap + small overshoot bounce), "spring" (oscillating
  # settle), or "linear".
  easing: easeOutBack
  # easeOutBack: overshoot strength (~1.7 default CSS easing constant).
  # spring: oscillation count (~1.2 default).
  overshoot: 1.7
  zoom:
    # Two-phase punch on every jump: the view first zooms OUT from 1 down to
    # `amount`, then zooms back IN to 1 (with the easing/overshoot above).
    enabled: true
    amount: 0.88       # trough scale at the peak of the pull-back (1 = no zoom)
    outFraction: 0.35  # fraction of jumpDuration spent zooming out; rest eases back in

word:
  # "line": jump once per subtitle cue, exactly on its start time (default,
  #   always on-beat since it's real data from the file).
  # "karaoke": jump per word using \k/\kf ASS timing tags when the cue has
  #   them, falling back to line-level for cues that don't.
  # "char-weighted": jump per word using synthesized timing (cue duration
  #   split proportionally to word length). An approximation — can drift off
  #   the beat — opt in only if you don't have real word-level timing.
  splitMode: line

layout:
  # Horizontal gap in px between words, and extra gap between cues/lines.
  wordGap: 40
  cueGap: 140
  # 'flow' (default): every word flows along one long horizontal line.
  # 'stacked': cues grouped into logical lines (see the timeline's Group/
  # Ungroup buttons) each flow in their own row; rows stack vertically and
  # the camera jumps on line transitions too, not just cue transitions.
  mode: flow
  # Stacked mode only, below this point.
  # Row spacing, as a multiple of font.size.
  lineHeight: 1.6
  # Render the logical line above/below the active one.
  showPrevLine: true
  showNextLine: true
  # How the next line's row lines up with the current one: 'start' — every
  # row shares a left edge; 'end' — the next row's first word starts
  # directly under the current row's last word (as if unwrapping one flow).
  nextLineFrom: start

style:
  # Opacity of the active vs. all other lines, for readability.
  activeOpacity: 1
  inactiveOpacity: 0.35
  # Full disappearance of a cue's words after its own `end` timestamp, on
  # top of (and independent from) the active/inactive opacity above — this
  # is what makes text actually leave the screen instead of just sitting at
  # activeOpacity forever once a cue is done (e.g. during a gap before the
  # next cue's jump fires). 'none' (default) disables it — unchanged
  # behavior. 'opacity' fades alpha to 0; 'slide' also drifts the text down
  # as it fades; 'scale' also shrinks it toward nothing.
  cueExit:
    type: none # none | opacity | slide | scale
    delay: 0.3 # seconds after cue.end before the exit animation starts
    duration: 0.5 # seconds the exit animation takes to reach fully hidden
  # Animated transition from activeOpacity down to inactiveOpacity when a
  # cue/line/word is superseded by the next jump, instead of an instant
  # snap. 'none' (default) disables it — unchanged behavior.
  fadeOut:
    type: none # none | opacity | slide | scale
    # cue: the whole superseded cue fades together (works in flow and
    # stacked mode). line: the whole stacked row fades together once a
    # *different row* becomes active (stacked mode only — in flow mode every
    # word shares one row, so this would never fire; use 'cue' there). word:
    # each word fades individually, staggered by wordStagger, giving a
    # left-to-right dissolve as an old line is read past.
    granularity: cue # cue | line | word
    delay: 0 # seconds after being superseded before the fade starts
    duration: 0.4 # seconds the fade takes to settle at inactiveOpacity
    wordStagger: 0.04 # seconds between each word's fade start (granularity: word)
    # In stacked mode, layout.showPrevLine only keeps ONE row above the
    # active one on screen at all — a row still mid-fade gets hard-cut the
    # instant a second new line takes over, not eased out. Keep
    # delay+duration comfortably shorter than your typical line spacing to
    # avoid a visible pop.

timeline:
  # Browser-preview-only: beat grid on the bottom timeline. Unset/null bpm
  # hides the grid entirely (the waveform and cue-block track still show).
  # You can also set/override this live from the timeline header in the browser.
  # bpm: 120
  # A bar is always a whole note (4 quarter-note beats). beatsPerBar picks the
  # grid/snap resolution as ticks per bar — 4/8/16/32, i.e. 1/4, 1/8, 1/16,
  # 1/32 notes — and never changes where bar lines fall or the bar count.
  beatsPerBar: 4
  # Time (seconds) of the first downbeat/bar line — not just any beat. Tune
  # this against the waveform in the preview until the grid lines land on
  # the kick/snare hits.
  gridOffset: 0

# Config markers — points in the timeline where camera/colors/style locally
# override everything above from that point on — are NOT set here. They live
# in their own gitignored, auto-created config-markers.json next to this
# file, edited via the timeline's 🚩 button in the browser preview (see
# README's "Preview in a browser" section), never by hand-editing YAML.
